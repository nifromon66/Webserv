<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>504 - Délai d'attente dépassé</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #9b59b6;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(155, 89, 182, 0.25);
            max-width: 600px;
        }
        h1 {
            font-size: 80px;
            margin: 0;
            color: #9b59b6;
        }
        h2 {
            font-size: 24px;
            margin-top: 10px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        a {
            text-decoration: none;
            color: #1a1a1a;
            background-color: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        a:hover {
            background-color: #9b59b6;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>504</h1>
        <h2>Délai d’attente dépassé</h2>
        <p>
            Le serveur a mis trop de temps à répondre.<br>
            Le traitement a été interrompu.
        </p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
