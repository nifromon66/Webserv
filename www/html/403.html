<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Accès Interdit</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            /* Couleur Orange pour l'interdiction */
            border: 2px solid #ff8800; 
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.2);
            max-width: 600px;
        }
        h1 { font-size: 80px; margin: 0; color: #ff8800; }
        h2 { font-size: 24px; margin-top: 10px; }
        p { color: #aaaaaa; margin-bottom: 30px; }
        a {
            text-decoration: none;
            color: #1a1a1a;
            background-color: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        a:hover { background-color: #ff8800; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>403</h1>
        <h2>Accès Interdit / Forbidden</h2>
        <p>Désolé, vous n'avez pas les droits nécessaires pour voir ce contenu.</p>
        <p>Le serveur refuse de répondre à votre requête.</p>
        <a href="/">Retour en lieu sûr</a>
    </div>
</body>
</html>
