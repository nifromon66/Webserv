<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #ff4444;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.2);
            max-width: 600px;
        }
        h1 { font-size: 80px; margin: 0; color: #ff4444; }
        h2 { font-size: 24px; margin-top: 10px; }
        p { color: #aaaaaa; margin-bottom: 30px; }
        a {
            text-decoration: none;
            color: #1a1a1a;
            background-color: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        a:hover { background-color: #ff4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login Failed</h1>
        <h2>You have failed to login</h2>
        <p>The inserted password syntax is incorrect.</p>
        <p>Syntax :</p>
        <p>Length : > 8 && < 42</p>
        <p>Characters : [a-zA-Z0-9_-]</p>
        <a href="/">Return to Home Page</a>
    </div>
</body>
</html>
