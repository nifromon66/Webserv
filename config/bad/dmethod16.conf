# # server : Bloc principal du serveur
server {                
    listen 8080;
    server_name localhost;
    
    client_max_body_size 10485760;

    root ./abc;  # Racine générale du serveur (pour les erreurs et la location /)
    error_page 403 html/403.html;
    error_page 404 html/404.html;
    error_page 413 html/413.html;
    error_page 504 html/504.html;

    # Test pour l'AutoIndex
    location /auto_test/ {
        allow_methods GET POST DELETE BLABLA;
        root ./www;
        autoindex on;
    }
    # 1. Location / : Doit répondre à GET request ONLY
    location / {
        allow_methods GET;
        # root ./www/html;
        index index.html; 
    }

    # 3. Location /post_body : pour tester l'erreur 413 (Petits fichiers seulement)
    location /post_body {
        allow_methods POST;
		root ./www/html/post_body;
        client_max_body_size 100;
    }

    # 4. Location /Directory: Root, Index spécifiques
    location /directory/ {
        allow_methods GET POST;
        root ./YoupiBanane; 
        index youpi.bad_extension;
        autoindex on;
    }


    # 5. Location /assets/ : Root, Index spécifiques et GET ONLY
    location /assets/ {
        allow_methods GET;
        root ./www/assets; 
    }
    
    location /uploads/ {
        allow_methods GET POST DELETE;
        root ./www/uploads;
        client_max_body_size 10M;
        autoindex on;
    }

    # Location CGI
    location ~ \.py$ {
        allow_methods GET POST;
        
        cgi_pass .py /usr/bin/python3;
        root ./www;
    }

	location ~ \.php$ {
        allow_methods GET POST;
        
        cgi_pass .php /usr/bin/php-cgi;
        root ./www;
    }

    location ~ \.bla$ {
        allow_methods GET POST;
        
        cgi_pass ./cgi_test;
        cgi_pass .py /usr/bin/python3;

    }

    # --- ROUTES ---

    # Démo 1 : Priorité à l'Index    
    # si cette location est appelée, le serveur doit servir le fichier index.html de cette location
    location /show_index/ {
        allow_methods GET;
        root ./www/demo_index;  # Contient index.html
        index index.html;       # Le fichier à servir
        autoindex on;
    }

    # Démo 2 : Autoindex forcé
    # la liste des fichiers doit s'afficher car il n'y a PAS de fichier index dans ce dossier
    location /show_list/ {
        allow_methods GET;
        root ./www/demo_listing; # Dossier sans index
        autoindex on;            # Liste obligatoire
    }


    # location /cgi-bin/ {
    #     cgi_pass .py /usr/bin/python3;
    #     cgi_pass .bla ./cgi_tester;
    # }


    location /tests/ {
        allow_methods GET POST DELETE;
        root ./;
        autoindex on;
    }

    # Location pour tester les octets bruts
    location /limit_bytes/ {
        allow_methods POST;
        client_max_body_size 10; # 10 octets max
        root ./www/uploads;
    }

    # Location pour tester le suffixe 'k' (1024 octets)
    location /limit_kilo/ {
        allow_methods POST;
        client_max_body_size 1k; # 1024 octets max
        root ./www/uploads;
    }

    # Location pour tester le suffixe 'm' (1 Mo)
    location /limit_mega/ {
        allow_methods POST;
        client_max_body_size 1m; 
        root ./www/uploads;
    }

    # Il n'a PAS de client_max_body_size, donc il doit hériter du 100 du serveur.
    location /heritage/ {
        allow_methods POST;
        root ./www/uploads;
    }
    
    # Test de la directive return pour les redirections
    location /old-page/ {
        return 301 /new-page.html;
    }

    # La page de destination
    location /new-page.html {
        root ./www/html;
        index new-page.html;
    }

	location /correction/ {
        allow_methods GET POST DELETE;
        root ./www/_websites/correction;
		index index.html;
        autoindex off;
    }
}


