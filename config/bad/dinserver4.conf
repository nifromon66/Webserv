# # server : Bloc principal du serveur
server {                
	
	sdfghjk

    listen 8080;
    server_name localhost;
    
    root ./www/html;  # Racine générale du serveur (pour les erreurs et la location /)
    error_page 404 /404.html;
    error_page 413 /413.html;

    # Test pour l'AutoIndex
    location /auto_test/ {
        allow_methods GET POST DELETE;
        root ./www;
        autoindex on;  # <--- C'est ça qu'on veut tester
    }
    # 1. Location / : Doit répondre à GET request ONLY
    location / {
        allow_methods GET;
        index index.html; 
    }

    # 2. Location /put_test/ : Doit répondre à PUT et sauvegarder les fichiers
    location /put_test/ {
        allow_methods PUT;
        upload_store www/uploads; 
    }

    # 3. Location /post_body : Doit répondre à POST avec limite de taille
    location /post_body {
        allow_methods POST;
        client_max_body_size 101048576; # 1 MB
    }

    # 4. Location /Directory: Root, Index spécifiques et GET ONLY
    location /directory/ {
        allow_methods GET;
        root YoupiBanane; 
        
        # Si aucun fichier n'est spécifié (/directory/), cherche 'youpi.bad_extension'
        index youpi.bad_extension; 
    }

    # 5. Location /assets/ : Root, Index spécifiques et GET ONLY
    location /assets/ {
        allow_methods GET;
        root ./www/assets; 
    }
    
    location /uploads/ {
        allow_methods GET POST DELETE;
        root ./www/;
        client_max_body_size 101048576; # 1 MB
        autoindex on;
    }



    # 6. Règle CGI pour les fichiers en .bla (POST ONLY)
    # L'expression régulière '~ \.bla$' intercepte tout chemin se terminant par .bla
    location ~ \.bla$ {
        allow_methods POST;
        
        cgi_pass /home/sandrine/Desktop/Ecole_42/42-Webserv/cgi_test; 
    }

    location /tests/ {
        allow_methods GET POST DELETE;
        root ./tests;
        autoindex on;
    }
}


